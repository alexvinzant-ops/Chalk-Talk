<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chalk Talk Playbook</title>
<meta name="description" content="Study, animate and quiz yourself on your team's basketball plays.">
<meta name="theme-color" content="#18222c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chalk Talk">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=Kalam:wght@700&display=swap">
<style>
/* Layout: playbook list on the left, the court as the hero in the middle, a coach's clipboard panel on the right. */
:root {
  --bg: #e9edf1; --surface: #ffffff; --surface-2: #f3f6f8; --ink: #18222c; --muted: #566472; --line: #cfd7de;
  --accent: #b84f15; --accent-ink: #ffffff; --ball: #e8742a;
  --off: #1d5bbf; --def: #c7322b; --court: #fbfcfd; --court-line: #7d8b97; --paint: #eef2f6; --apron: #dfe5ea;
  --good: #2e7d4f; --warn: #9a6200; --bad: #c7322b;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --hand: "Kalam", "Comic Sans MS", "Segoe Print", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151a; --surface: #182029; --surface-2: #1f2832; --ink: #e4eaef; --muted: #95a3af; --line: #2d3a47;
  --accent: #f08a3e; --accent-ink: #1a0e05; --ball: #f08a3e;
  --off: #86b6ff; --def: #ff7d73; --court: #1b252d; --court-line: #a9b8c4; --paint: #222e38; --apron: #141c22;
  --good: #5cc489; --warn: #e0a53a; --bad: #ff7d73; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151a; --surface: #182029; --surface-2: #1f2832; --ink: #e4eaef; --muted: #95a3af; --line: #2d3a47;
  --accent: #f08a3e; --accent-ink: #1a0e05; --ball: #f08a3e;
  --off: #86b6ff; --def: #ff7d73; --court: #1b252d; --court-line: #a9b8c4; --paint: #222e38; --apron: #141c22;
  --good: #5cc489; --warn: #e0a53a; --bad: #ff7d73; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { min-height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
img { max-width: 100% }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: .01em }
a { color: var(--accent) }

.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 14px }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.brand h1 { font-size: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em }
.brand h1 span { color: var(--accent) }
.brand small { color: var(--muted); font-size: 13px }
.top .spacer { flex: 1 }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap }
.chip b { color: var(--ink); font-weight: 600 }
.chip.coach { border-color: var(--accent); color: var(--accent); font-weight: 600 }

.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 12px 16px; align-items: start }
.lib { grid-column: 1; grid-row: 1 / span 2; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 100px); position: sticky; top: 12px; min-width: 0 }
.nav { grid-column: 2; grid-row: 1; display: flex; gap: 4px; border-bottom: 2px solid var(--line); min-width: 0 }
.nav button { border: 0; background: none; padding: 8px 14px; font-family: var(--display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; display: flex; align-items: center; gap: 7px }
.nav button svg { width: 18px; height: 18px; fill: currentColor; flex: none }
.nav button[aria-current="page"] { color: var(--ink); border-color: var(--accent) }
.nav .phone-only { display: none }
.lib-head { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line) }
.lib-head .row { display: flex; gap: 8px; align-items: center; justify-content: space-between }
.lib-head h2 { font-size: 20px; text-transform: uppercase }
.seg { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px }
.seg button { flex: 1; border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .12) }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2) }
.unpub { border: 1px dashed var(--accent); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px }
.unpub b { color: var(--accent) }
.unpub .controls .btn { padding: 5px 9px; font-size: 13px }
.list { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 2px }
.item { text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center }
.item:hover { background: var(--surface-2) }
.item[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent) }
.item .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.side { font-family: var(--display); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 1px 7px; border-radius: 4px; border: 1.5px solid currentColor }
.side.o { color: var(--off) } .side.d { color: var(--def) }
.tag-ex { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 5px }
.done { color: var(--good); font-weight: 600 }
.empty { padding: 18px 12px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 10px }

.stage { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.back { align-self: flex-start; border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 14px }
.transport { display: grid; grid-template-columns: 44px 44px minmax(0, 1fr) 44px; gap: 6px }
.transport .btn { min-height: 44px }
.transport .btn svg { width: 20px; height: 20px }
.iplay { display: flex; align-items: center; gap: 10px }
.iplay .lbl { flex: none }
.more { border-top: 1px solid var(--line); padding-top: 10px }
.more summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; padding: 4px 0; list-style-position: inside }
.more[open] summary { margin-bottom: 10px }
.more .inner { display: flex; flex-direction: column; gap: 14px }
.bigbtns { display: flex; flex-direction: column; gap: 8px }
.bigbtns .btn { flex-direction: column; align-items: flex-start; gap: 1px; min-height: 48px; padding: 10px 14px; font-size: 15px; text-align: left }
.bigbtns .btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px }
.bigbtns .btn.primary small { color: inherit; opacity: .85 }
.status { border-radius: 9px; padding: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px }
.status.ok { background: color-mix(in srgb, var(--good) 12%, transparent) }
.status.pending { background: color-mix(in srgb, var(--accent) 12%, transparent) }
.howto { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 14px }
.phone-hint { display: none }
@media (max-width: 760px) { .phone-hint { display: block } }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start }
.board-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; min-width: 0 }
#board { display: block; width: 100%; max-width: 100%; height: auto; max-height: 76vh; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none }
.board-cap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); padding: 6px 4px 0 }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.panel h2 { font-size: 26px; line-height: 1.1 }
.panel .sub { color: var(--muted); font-size: 13.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.panel p { margin: 0 }
.lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.field { display: flex; flex-direction: column; gap: 5px }
.field input:not([type=checkbox]):not([type=range]):not([type=file]), .field select, .field textarea, select.inline { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); width: 100% }
.field textarea { resize: vertical; min-height: 60px }
textarea.code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px }
input[type=file] { font-size: 13px; max-width: 100% }
.steps { display: flex; gap: 4px; flex-wrap: wrap }
.steps button { min-width: 34px; height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); font-family: var(--hand); font-size: 15px; line-height: 1 }
.steps button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.steps button.add { font-family: var(--body); font-size: 13px; color: var(--accent); border-style: dashed }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; text-decoration: none; color: var(--ink) }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--bad) }
.btn.danger.solid { background: var(--bad); color: var(--surface); border-color: var(--bad) }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.btn.icon { width: 38px; padding: 7px 0 }
.btn svg { width: 16px; height: 16px; fill: currentColor }
.note { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 16px; line-height: 1.5 }
.note .num { font-family: var(--hand); color: var(--accent); font-size: 18px; margin-right: 6px }
.role { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 14.5px }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px; color: var(--muted) }
.legend div { display: flex; align-items: center; gap: 8px }
.legend svg { width: 40px; height: 14px; flex: none }
.cards { display: flex; flex-direction: column; gap: 10px }
.card { border: 1px solid var(--line); border-radius: 9px; padding: 12px; display: flex; flex-direction: column; gap: 8px }
.card h3 { font-size: 19px; text-transform: uppercase }
.card p { color: var(--muted); font-size: 14px }
.result { border-radius: 8px; padding: 10px 12px; font-weight: 600; font-size: 15px }
.result.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good) }
.result.ok { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn) }
.result.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad) }
.score { font-family: var(--display); font-size: 54px; font-weight: 700; line-height: 1 }
.choices { display: flex; flex-direction: column; gap: 6px }
.choices .btn { justify-content: flex-start; text-align: left }
.choices .btn.right { border-color: var(--good); color: var(--good) }
.choices .btn.wrong { border-color: var(--bad); color: var(--bad) }
.pchips { display: flex; gap: 6px; flex-wrap: wrap }
.pchips button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-family: var(--hand); font-size: 15px }
.pchips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink) }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 14px }
.toggles label { display: inline-flex; gap: 4px; align-items: center; font-family: var(--hand) }
.moves { display: flex; flex-direction: column; gap: 6px }
.moves .mv { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center }
.moves .who { font-family: var(--hand); font-size: 17px; text-align: center }
.hint { font-size: 13px; color: var(--muted) }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.sep { border: 0; border-top: 1px solid var(--line); margin: 0 }
.gifbox { display: flex; flex-direction: column; gap: 8px }
.gifbox img { border: 1px solid var(--line); border-radius: 8px; background: var(--court) }
.trace-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px }
.trace-ctl input[type=range] { flex: 1; min-width: 100px }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px) }
footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted) }
footer button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline }

/* court */
.c-apron { fill: var(--apron) }
.c-floor { fill: var(--court) }
.c-paint { fill: var(--paint) }
.c-line, .c-board { fill: none; stroke: var(--court-line); stroke-width: .16 }
.c-board { stroke-width: .3 }
.c-dash { fill: none; stroke: var(--court-line); stroke-width: .16; stroke-dasharray: .8 .6 }
.c-rim { fill: none; stroke: var(--ball); stroke-width: .22 }
.c-label { font-family: var(--body); font-size: 1.1px; fill: var(--court-line); letter-spacing: .1px; text-transform: uppercase }
.p-o { stroke: var(--off) } .p-d { stroke: var(--def) } .p-b { stroke: var(--ball) }
.path { fill: none; stroke-width: .28; stroke-linecap: round; stroke-linejoin: round }
.path.pass { stroke-dasharray: .9 .7 }
.paths.faint { opacity: .4 }
.tok .hit { fill: transparent }
.tok .ring { fill: none; stroke: var(--accent); stroke-width: .35; opacity: 0 }
.tok.me .ring { opacity: 1 }
.tok.drag { cursor: grab }
.tok.o .body { fill: var(--court); stroke: var(--off); stroke-width: .3 }
.tok.o text { fill: var(--off); font-family: var(--hand); font-size: 2.2px; text-anchor: middle }
.tok.d .xbg { fill: var(--court); opacity: .85 }
.tok.d .x { stroke: var(--def); stroke-width: .42; stroke-linecap: round }
.tok.d text { fill: var(--def); font-family: var(--hand); font-size: 1.6px }
#ballg .b { fill: var(--ball) }
#ballg .seam { fill: none; stroke: var(--court); stroke-width: .12 }
.ghost { fill: none; stroke: var(--accent); stroke-width: .25; stroke-dasharray: .5 .4 }
.miss { stroke: var(--accent); stroke-width: .18; stroke-dasharray: .4 .4 }

@media (max-width: 1080px) { .work { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 760px) {
  body { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)) }
  .top { padding-block: 10px }
  .brand small, .desk-only { display: none }
  .brand h1 { font-size: 24px }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: none }
  .lib, .stage { grid-column: auto; grid-row: auto }
  .lib { position: static; max-height: none; border-radius: 12px }
  .item { padding: 12px }
  .item .nm { font-size: 17px }
  body[data-view="plays"] .stage, body:not([data-view="plays"]) .lib { display: none }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); border-bottom: 0;
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); gap: 4px }
  .nav button { flex: 1; flex-direction: column; gap: 2px; font-family: var(--body); font-size: 11.5px; letter-spacing: .02em; text-transform: none; border: 0; margin: 0; padding: 6px 2px; border-radius: 10px }
  .nav button svg { width: 24px; height: 24px }
  .nav button[aria-current="page"] { color: var(--accent); background: var(--surface-2) }
  .nav .phone-only { display: flex }
  .board-wrap { padding: 6px }
  #board { max-height: 56vh }
  .panel { padding: 14px }
  .panel h2 { font-size: 24px }
  .steps button { min-width: 40px; height: 36px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Chalk <span>Talk</span></h1><small>Learn the plays before the whistle</small></div>
  <div class="spacer"></div>
  <span class="chip coach" id="coachChip" hidden>Coach tools on</span>
  <span class="chip" id="progChip">Studied <b>0</b></span>
</header>

<div class="app">
  <aside class="lib" aria-label="Playbook">
    <div class="lib-head">
      <div class="row"><h2>Playbook</h2><button class="btn" id="newBtn" hidden>New play</button></div>
      <div id="unpub"></div>
      <div class="seg" role="group" aria-label="Filter plays">
        <button data-filter="all" aria-pressed="true">All</button>
        <button data-filter="offense" aria-pressed="false">Offense</button>
        <button data-filter="defense" aria-pressed="false">Defense</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search plays" aria-label="Search plays">
    </div>
    <div class="list" id="list"><div class="empty">Loading the playbook…</div></div>
  </aside>

  <nav class="nav" aria-label="Sections">
    <button data-mode="plays" class="phone-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>Plays</button>
    <button data-mode="study"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Study</button>
    <button data-mode="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.4-2.1 1.2-2.8l1.2-1.3a2 2 0 1 0-3.4-1.4H8a4 4 0 1 1 7.1 2.3z"/></svg>Quiz</button>
    <button data-mode="coach" id="coachNav" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v12H3zm2 2v8h14V6zm3 12h8v2H8zM7 8l3 3-3 3-1-1 2-2-2-2zm5 4h5v2h-5z"/></svg>Coach</button>
  </nav>

  <main class="stage">
    <div class="work">
      <div class="board-wrap">
        <svg id="board" viewBox="-2 -4 54 53" role="img" aria-label="Half court diagram">
          <defs>
            <marker id="m-o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--off)"/></marker>
            <marker id="m-d" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--def)"/></marker>
            <marker id="m-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill:var(--ball)"/></marker>
          </defs>
          <g id="court"></g>
          <g id="traceg" hidden><image id="trace" x="0" y="0" width="50" height="47" preserveAspectRatio="xMidYMid meet"/></g>
          <g id="courtlines"></g>
          <g id="paths" class="paths"></g>
          <g id="ghosts"></g>
          <g id="toks"></g>
          <g id="ballg" hidden><circle class="b" r=".85"/><path class="seam" d="M-.85 0 H.85 M0 -.85 V.85"/></g>
        </svg>
        <div class="board-cap"><span>Half court · basket at top</span><span id="capR"></span></div>
      </div>
      <section class="panel" id="panel" aria-live="polite"></section>
    </div>
  </main>
</div>
<footer>

function renderWhere() {

const fmt = n => Number.isInteger(n) ? n : n.toFixed(1);

function guessRepo() {

  status === 403 ? "This access key can't change the repository. Make a new key with Contents set to Read and write." :
  status === 404 ? "GitHub can't find that repository with this key. Check the repository name, and that the key includes it." :
  "Couldn't reach GitHub. Check your connection and try again.";
async function connectGitHub() {
  const repo = $("#ghRepo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/$/g, ""), token = $("#ghToken").value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast("Enter the repository as owner/name, like alexvinzant-ops/Chalk-Talk."); return }
  if (!token) { toast("Paste your access key first."); return }
  const prev = S.gh; S.gh = { repo, token };
  let r; try { r = await ghFetch("/contents/plays.json") } catch { r = { status: 0 } }
  if (r.ok || r.status === 404 && (await ghFetch("")).ok) {
    store.set("gh", S.gh); S.ghEdit = false; toast("Connected. You can publish with one tap now."); renderHeader(); renderCoach();
  } else { S.gh = prev; toast(ghError(r.status)) }
}
async function publish() {
  if (!ghReady() || S.publishing) return;
  S.publishing = true; renderHeader(); if (S.mode === "coach") renderCoach();
  const content = JSON.stringify({ app: "chalk-talk", version: 1, publishedAt: new Date().toISOString(), plays: S.plays.map(toDoc) }, null, 1);
  let msg = null;
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      const g = await ghFetch("/contents/plays.json?t=" + Date.now());
      if (!g.ok && g.status !== 404) { msg = ghError(g.status); break }
      const sha = g.ok ? (await g.json()).sha : undefined;
      const r = await ghFetch("/contents/plays.json", { method: "PUT", body: JSON.stringify({ message: `Update playbook (${S.plays.length} plays)`, content: b64(content), sha }) });
      if (r.ok) { msg = ""; break }
      if (r.status !== 409) { msg = ghError(r.status); break }
    }
  } catch { msg = ghError(0) }
  S.publishing = false;
  if (msg === "") {
    S.sitePlays = clone(S.plays); store.del("localPlaybook"); S.localDirty = false;
    toast("Published. Players will see the new plays in about a minute.");
  } else toast(msg || "Couldn't publish. Try again.");

}

      const e = g.pts[g.pts.length - 1], u = g.u, n = [-u[1], u[0]], tip = [e[0] + u[0] * .42, e[1] + u[1] * .42], base = [e[0] - u[0] * .98, e[1] - u[1] * .98];
      ctx.beginPath(); ctx.moveTo(...tip); ctx.lineTo(base[0] + n[0] * .7, base[1] + n[1] * .7); ctx.lineTo(base[0] - n[0] * .7, base[1] - n[1] * .7); ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const id of tokOrder(play)) {
    const p = f.pos[id]; if (!p) continue;
    ctx.save(); ctx.translate(p[0], p[1]);
    if (team(id) === "o") {
      ctx.beginPath(); ctx.arc(0, 0, 1.7, 0, 7); ctx.fillStyle = C.floor; ctx.fill(); ctx.lineWidth = .3; ctx.strokeStyle = C.off; ctx.stroke();
      ctx.fillStyle = C.off; ctx.font = '700 2.2px Kalam, "Comic Sans MS", cursive'; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(id, 0, .75);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, 7); ctx.globalAlpha = .85; ctx.fillStyle = C.floor; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = C.def; ctx.lineWidth = .42; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-1.15, -1.15); ctx.lineTo(1.15, 1.15); ctx.moveTo(1.15, -1.15); ctx.lineTo(-1.15, 1.15); ctx.stroke();
      ctx.fillStyle = C.def; ctx.font = '700 1.6px Kalam, "Comic Sans MS", cursive'; ctx.textAlign = "left"; ctx.fillText(id.slice(1), 1.2, 2.15);
    }
    ctx.restore();
  }
  if (f.bp) {
    ctx.beginPath(); ctx.arc(f.bp[0], f.bp[1], .85, 0, 7); ctx.fillStyle = C.ball; ctx.fill();
    ctx.strokeStyle = C.floor; ctx.lineWidth = .12; ctx.beginPath(); ctx.moveTo(f.bp[0] - .85, f.bp[1]); ctx.lineTo(f.bp[0] + .85, f.bp[1]); ctx.moveTo(f.bp[0], f.bp[1] - .85); ctx.lineTo(f.bp[0], f.bp[1] + .85); ctx.stroke();
  }
  /* caption band under the court */
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const top = Math.round(53 * s);
  ctx.fillStyle = C.line; ctx.fillRect(0, top, W, 1);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.ink; ctx.font = '700 22px "Barlow Condensed", "Arial Narrow", sans-serif'; ctx.fillText(play.name.toUpperCase(), 14, top + 28);
  ctx.fillStyle = C.accent; ctx.font = '700 15px Kalam, "Comic Sans MS", cursive'; ctx.textAlign = "right"; ctx.fillText(caption.tag, W - 14, top + 27);
  ctx.textAlign = "left"; ctx.fillStyle = C.muted; ctx.font = '500 14px Barlow, "Segoe UI", sans-serif';
  const words = caption.text.split(/\s+/), lines = [""];
  for (const w of words) { const t = (lines[lines.length - 1] + " " + w).trim(); if (ctx.measureText(t).width > W - 28 && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = t }
  if (lines.length > 3) { lines.length = 3; lines[2] = lines[2].replace(/\s*\S*$/, "") + "…" }
  lines.forEach((l, i) => ctx.fillText(l, 14, top + 50 + i * 18));
}
async function makeGif(play) {
  S.gif = { playId: play.id, status: "Making the GIF…" }; renderStudyPanel(play);
  try {
    await Promise.all(['700 22px "Barlow Condensed"', '500 14px Barlow', '700 15px Kalam'].map(f => document.fonts.load(f).catch(() => {})));
    const W = 440, s = W / 54, H = Math.round(53 * s) + 108;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    const gw = new GifWriter(W, H, gifPalette()), sts = buildStates(play), N = play.steps.length, FR = 12;
    const add = (f, paths, faint, cap, delay) => { drawGifFrame(ctx, play, W, H, s, f, paths, faint, cap); gw.addFrame(ctx.getImageData(0, 0, W, H).data, delay) };
    const still = st => ({ pos: st.pos, bp: st.pos[st.ball] ? ballOff(st.pos[st.ball]) : null });
    add(still(sts[0]), [], false, { tag: "Setup", text: play.summary || "Starting spots." }, 180);
    for (let i = 1; i <= N; i++) {
      if (S.gif?.playId !== play.id) return;
      S.gif.status = `Making the GIF… step ${i} of ${N}`; renderStudyPanel(play);
      await new Promise(r => setTimeout(r, 0));
      const paths = pathsFor(play, sts, i), cap = { tag: `Step ${i} of ${N}`, text: play.steps[i - 1].note || "" };
      for (let k = 1; k <= FR; k++) add(frameAt(play, sts, i, k / FR), paths, k < FR, cap, 8);
      add(still(sts[i]), paths, false, cap, i === N ? 300 : 170);
    }
    const blob = new Blob([gw.finish()], { type: "image/gif" }), file = new File([blob], `${slug(play.name)}.gif`, { type: "image/gif" });
    if (S.gif?.playId !== play.id) return;
    S.gif = { playId: play.id, url: URL.createObjectURL(blob), size: blob.size, file, canShare: !!(navigator.canShare && navigator.canShare({ files: [file] })) };
  } catch (e) {
    console.error(e); S.gif = null; toast("Couldn't make the GIF on this device.");
  }
  if (S.mode === "study" && curPlay()?.id === play.id) renderStudyPanel(play);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.filter) { S.filter = t.dataset.filter; store.set("filter", S.filter); renderList(); return }
  if (t.dataset.play) {
    S.sel = t.dataset.play; store.set("sel", S.sel); S.step = 0; S.gif = null; renderList();
    if (S.mode === "edit") openEditor(curPlay()); else setMode(["quiz", "import", "coach"].includes(S.mode) ? S.mode : "study");
    return;
  }
  if (t.dataset.mode) { if (t.dataset.mode === "edit") openEditor(curPlay()); else setMode(t.dataset.mode); return }
  if (t.dataset.step != null) { goStep(+t.dataset.step); return }
  if (t.dataset.estep != null) { S.edit.step = +t.dataset.estep; S.edit.confirm = false; renderEdit(); return }
  if (t.dataset.pass) { S.quiz.pass = t.dataset.pass; renderWhere(); return }
  if (t.dataset.guess) { const q = S.quiz; q.answer = t.dataset.guess; q.total++; if (q.answer === q.playId) q.right++; renderName(); return }
  if (t.dataset.unmove) { delete S.edit.draft.steps[S.edit.step - 1].moves[t.dataset.unmove]; renderEdit(); return }
  const act = t.dataset.act; if (!act) return;
  ({
    restart: () => goStep(0), prev: () => goStep(S.step - 1), next: () => goStep(S.step + 1), play: togglePlay,
    where: startWhere, lock: lockIn, qnext: nextWhere,
    qreplay: () => { const q = S.quiz, play = S.plays.find(p => p.id === q.playId), sts = buildStates(play); scene(play, { pos: sts[q.i - 1].pos, ball: sts[q.i - 1].ball, paths: pathsFor(play, sts, q.i), me: q.me }); animateStep(play, sts, q.i) },
    quitquiz: () => { stopAnim(); S.quiz = null; renderQuiz() },
    tostudy: () => { S.step = 0; setMode("study") },
    namequiz: startName,
    replayname: () => { const p = S.plays.find(x => x.id === S.quiz.playId); if (p) runWhole(p) },
    new: () => openEditor(null),
    addstep: () => { const d = S.edit.draft; d.steps.splice(S.edit.step, 0, { note: "", pass: null, moves: {} }); S.edit.step++; renderEdit() },
    delstep: () => { const d = S.edit.draft; d.steps.splice(S.edit.step - 1, 1); S.edit.step = Math.min(S.edit.step, d.steps.length); renderEdit() },
    save: savePlay, cancel: () => { S.edit = null; setMode("coach") },
    del: () => { S.edit.confirm = true; renderEdit() }, delyes: deletePlay,
    untrace: () => { S.trace = null; renderEdit(); showTrace() },
    export: exportPlaybook,
    discard: () => { S.confirmDiscard = true; renderHeader() }, discardyes: discardLocal,
    importtext: () => { const v = $("#importText").value; if (v.trim()) importPlays(v, "The pasted text"); else toast("Paste some play code first.") },
    copyprompt: () => {
      const done = () => toast("Instructions copied.");
      const fallback = () => { const ta = $("#promptText"); ta.closest("details").open = true; ta.select(); toast("Press Ctrl+C (or Copy) to copy the selected instructions.") };
      navigator.clipboard ? navigator.clipboard.writeText(AI_PROMPT).then(done, fallback) : fallback();
    },
    gif: () => { const p = curPlay(); if (p) makeGif(p) },
    closegif: () => { S.gif = null; renderStudyPanel(curPlay()) },
    sharegif: () => { const g = S.gif; navigator.share({ files: [g.file], title: curPlay()?.name }).catch(() => {}) },
    editcur: () => openEditor(curPlay()),
    publish, ghconnect: connectGitHub,
    ghchange: () => { S.ghEdit = true; renderCoach() }, ghcancel: () => { S.ghEdit = false; renderCoach() },
    ghforget: () => { S.gh = { repo: S.gh.repo, token: "" }; store.set("gh", S.gh); toast("This device can't publish anymore."); renderHeader(); renderCoach() },
    coachoff: () => setCoach(false)
  })[act]?.();
});
$("#newBtn").addEventListener("click", () => openEditor(null));
function setCoach(on) {
  S.coach = on; store.set("coach", on);
  if (on) { const local = store.get("localPlaybook", null); if (local) { S.plays = parsePlaybook(local).filter(Boolean); S.localDirty = true; sortPlays() } toast("Coach tools on. Changes stay on this device until you publish them.") }
  else { S.plays = clone(S.sitePlays); S.localDirty = false; sortPlays(); if (!curPlay()) S.sel = S.plays[0]?.id || null }
  renderList(); setMode(on ? "coach" : "study");
}
$("#coachToggle").addEventListener("click", () => setCoach(true));
$("#q").addEventListener("input", e => { S.q = e.target.value; renderList() });
document.addEventListener("change", e => {
  const t = e.target, play = curPlay();
  if (t.id === "mePick" && play) { S.me[play.id] = t.value; store.set("me", S.me); renderStudy(); return }
  if (t.id === "quizMe" && play) { S.me[play.id] = t.value; store.set("me", S.me); renderQuiz(); return }
  if (t.id === "speed") { S.speed = +t.value; store.set("speed", S.speed); return }
  if (t.id === "importFile") {
    for (const f of t.files) f.text().then(txt => importPlays(txt, f.name));
    return;
  }
  if (t.id === "traceFile" || t.id === "traceFile2") { loadTrace(t.files[0]); return }
  if (t.id === "traceFlip") { S.trace.flip = t.checked; showTrace(); return }
  if (!S.edit) return;
  const d = S.edit.draft;
  if (t.dataset.tok) return toggleTok(t.dataset.tok, t.checked);
  if (t.id === "eBall") { d.ball = t.value; return renderEdit() }
  if (t.id === "eSide") { d.side = t.value; return renderEdit() }
  if (t.id === "ePass") { d.steps[S.edit.step - 1].pass = t.value || null; return renderEdit() }
  if (t.dataset.kind) { d.steps[S.edit.step - 1].moves[t.dataset.kind].kind = t.value; return renderEdit() }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "traceOp" && S.trace) { S.trace.opacity = +t.value; showTrace(); return }
  if (!S.edit) return; const d = S.edit.draft;
  if (t.id === "eName") d.name = t.value;
  else if (t.id === "eCat") d.category = t.value;
  else if (t.id === "eSum") d.summary = t.value;
  else if (t.id === "eNote") d.steps[S.edit.step - 1].note = t.value;
  else if (t.dataset.role) d.roles[t.dataset.role] = t.value;
});
document.addEventListener("paste", e => {
  if (!S.coach || !["import", "edit", "coach"].includes(S.mode)) return;
  const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
  if (item) { e.preventDefault(); loadTrace(item.getAsFile()) }
});
document.addEventListener("keydown", e => {
  if (S.mode !== "study" || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); goStep(S.step + 1) }
  else if (e.key === "ArrowLeft") { e.preventDefault(); goStep(S.step - 1) }
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); togglePlay() }
});
let toastT;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200) }

/* ---------- loading ---------- */
function sortPlays() { S.plays.sort((a, b) => b.side.localeCompare(a.side) || a.name.localeCompare(b.name)) }
async function boot() {
  let site = null;
  try { const r = await fetch("plays.json?v=" + Date.now(), { cache: "no-store" }); if (r.ok) site = parsePlaybook(await r.json()).filter(Boolean) } catch {}
  S.siteMissing = !site;
  S.sitePlays = site || STARTER.map(p => normPlay(p.id, p));
  const local = S.coach ? store.get("localPlaybook", null) : null;
  if (local) { S.plays = parsePlaybook(local).filter(Boolean); S.localDirty = true }
  else S.plays = clone(S.sitePlays);
  sortPlays();
  S.loaded = true;
  if (!curPlay()) { S.sel = S.plays[0]?.id || null; S.step = 0 }
  renderHeader(); renderList(); renderStage();
}
renderHeader(); renderStage(); boot();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
